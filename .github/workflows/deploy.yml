name: Deploy

# Deploys the backend, then the admin web app, to the VPS after CI passes on main. Can also be started by hand (Actions tab).
# Setup and secrets: backlog/docs/guides/doc-11 - Deploy-to-a-VPS.md, section "Auto deploy".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of cancelling a half-done build.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend to VPS
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # A normal deploy takes about 3 minutes. deploy.sh limits each build try to 6 minutes (two tries) and the start
    # to 6 minutes, so this only stops a run that hangs outside it (for example a dead SSH link). Doc-11, Troubleshooting.
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          # The exact commit CI tested (workflow_run), or the latest main (manual run).
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice::VPS secrets are not set, so nothing was deployed. See doc-11, section Auto deploy."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # ServerAlive: notice a dead connection in about 3 minutes instead of waiting forever.
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "${VPS_USER:-root}@$VPS_HOST" \
            "set -e; cd ${VPS_APP_DIR:-saynata}; git fetch -q origin main; git merge --ff-only $SHA; backend/scripts/deploy.sh"

  # The admin app is only static files. It is built here, not on the VPS (no Node there, and a small VPS can run out
  # of memory during the build), then copied into admin/dist on the server, where Caddy serves it (doc-11, section 8).
  # It runs after the backend job, because that job moves the server's repo to this commit first.
  deploy-admin:
    name: Deploy admin web app to VPS
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Skip when VPS secrets are not set
        if: env.VPS_HOST == '' || env.VPS_SSH_KEY == ''
        run: echo "::notice::VPS secrets are not set, so the admin app was not deployed. See doc-11, section Auto deploy."
      - uses: actions/checkout@v4
        if: env.VPS_HOST != '' && env.VPS_SSH_KEY != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: env.VPS_HOST != '' && env.VPS_SSH_KEY != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Build
        if: env.VPS_HOST != '' && env.VPS_SSH_KEY != ''
        working-directory: admin
        env:
          # The backend address baked into the build. Change it with the ADMIN_API_URL repository variable.
          VITE_API_URL: ${{ vars.ADMIN_API_URL || 'https://api.saynata.com' }}
        run: |
          npm ci
          npm run build
      - name: Copy admin/dist to the VPS
        if: env.VPS_HOST != '' && env.VPS_SSH_KEY != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_cmd="ssh -i $HOME/.ssh/deploy_key -p ${VPS_PORT:-22} -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6"
          target="${VPS_USER:-root}@$VPS_HOST"
          dist="${VPS_APP_DIR:-saynata}/admin/dist"
          $ssh_cmd "$target" "mkdir -p $dist"
          # --delete removes old hashed files, so the folder holds only this build.
          rsync -az --delete -e "$ssh_cmd" admin/dist/ "$target:$dist/"
          # Caddy runs as its own user and must be able to read the files.
          $ssh_cmd "$target" "chmod -R o+rX $dist"
          echo "Admin app deployed to $dist."

  # The learner web app (web/, Next.js). Same idea as the admin job: `next build` runs here, not on the VPS (a small VPS
  # can run out of memory during it). The standalone server is copied to web/dist on the server; web/scripts/deploy-web.sh
  # puts it into a node:22-alpine image and restarts only the web container. Caddy sends saynata.com to it (doc-11, section 14).
  deploy-web:
    name: Deploy web app to VPS
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Skip when VPS secrets are not set
        if: env.VPS_HOST == '' || env.VPS_SSH_KEY == ''
        run: echo "::notice::VPS secrets are not set, so the web app was not deployed. See doc-11, section Auto deploy."
      - uses: actions/checkout@v4
        if: env.VPS_HOST != '' && env.VPS_SSH_KEY != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: env.VPS_HOST != '' && env.VPS_SSH_KEY != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        if: env.VPS_HOST != '' && env.VPS_SSH_KEY != ''
        working-directory: web
        run: |
          npm ci
          npm run build
          # What the container needs: the server, the static files and the public folder (Next.js standalone layout).
          mkdir dist
          cp -R .next/standalone/. dist/
          mkdir -p dist/.next
          cp -R .next/static dist/.next/static
          cp -R public dist/public
      - name: Copy web/dist to the VPS and restart the web container
        if: env.VPS_HOST != '' && env.VPS_SSH_KEY != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_cmd="ssh -i $HOME/.ssh/deploy_key -p ${VPS_PORT:-22} -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6"
          target="${VPS_USER:-root}@$VPS_HOST"
          app="${VPS_APP_DIR:-saynata}"
          $ssh_cmd "$target" "mkdir -p $app/web/dist"
          # --delete removes files of the old build, so the folder holds only this build.
          rsync -az --delete -e "$ssh_cmd" web/dist/ "$target:$app/web/dist/"
          $ssh_cmd "$target" "bash $app/web/scripts/deploy-web.sh"
      - name: Check https://saynata.com
        if: env.VPS_HOST != '' && env.VPS_SSH_KEY != ''
        # Fails the job when DNS or Caddy for saynata.com is not set up yet (doc-11, section 14).
        run: curl -fsS --max-time 20 --retry 6 --retry-delay 10 --retry-all-errors https://saynata.com -o /dev/null
