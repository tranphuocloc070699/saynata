[project]
name = "pipeline"
version = "0.1.0"
description = "Builds the simple-English + Vietnamese dictionary data for the app."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
