services:
  db:
    image: postgres:17-alpine
    container_name: saynata-db
    restart: unless-stopped
    environment:
      # Compose reads these from backend/.env (same folder)
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: saynata
    ports:
      # Only this computer can connect (not the whole network)
      - "127.0.0.1:5432:5432"
    volumes:
      - saynata-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d saynata"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  saynata-db-data:
