# Production compose file: backend + Postgres. The dev file is compose.yaml (Postgres only).
#
#   cp .env.example .env     # then fill in CLAUDE_API_KEY, DB_PASSWORD and ADMIN_JWT_SECRET
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Docker Compose reads .env in this folder for the ${...} values below.
# See the guide "Deploy to a VPS" in backlog/docs/guides/.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: english_translation
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Only on the server itself (127.0.0.1), never on the internet. The dictionary pipeline on your Mac reaches it
      # through an SSH tunnel: ssh -L 55432:127.0.0.1:${POSTGRES_PORT:-5432} <server>  (see the deploy guide).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d english_translation"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:?Set CLAUDE_API_KEY in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/english_translation
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Spring would try to start the dev compose.yaml otherwise.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # Admin web app API. Empty values are fine only with ADMIN_ENABLED=false.
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      # App user accounts (email code sign-in) and Claude cost limits. See "AWS SES setup" in the deploy guide.
      # All are optional: with none of them the backend still starts (codes go to the log, not to email).
      USER_JWT_SECRET: ${USER_JWT_SECRET:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # true = guests cannot cause new Claude calls. Set false until the app with sign-in is released.
      REQUIRE_SIGN_IN: ${REQUIRE_SIGN_IN:-true}
      CLAUDE_DAILY_BUDGET_USD: ${CLAUDE_DAILY_BUDGET_USD:-1.00}
      # Optional override for the model in application.properties.
      APP_CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-5-5}
      # Photos and clips for new words. Empty PIXABAY_API_KEY = none are fetched. MEDIA_DIR is /app/media (Dockerfile).
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-https://api.loffy.me/media}
    volumes:
      # The media folder on the server. The backend writes to it, Caddy serves it read-only at /media/ (doc-11).
      # The folder must be owned by user 10001: sudo chown 10001:10001 /var/lib/saynata/media
      - ${MEDIA_HOST_DIR:-/var/lib/saynata/media}:/app/media
    ports:
      # Port on the server: BACKEND_PORT in .env (default 8081).
      # With a reverse proxy (Caddy) set BACKEND_BIND=127.0.0.1 so only the proxy can reach it.
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
