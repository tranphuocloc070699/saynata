spring.application.name=backend
# 8080 is taken by the local Jitsi container.
server.port=${PORT:8081}

# Load secrets from backend/.env (git-ignored), like dotenv in JS. A real env variable wins over the file.
spring.config.import=optional:file:.env[.properties]

# Schema comes from Flyway (src/main/resources/db/migration). Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

app.claude.api-key=${CLAUDE_API_KEY:}
app.claude.model=claude-haiku-5-5
# Bump a version when its prompt changes, so old cached answers are not served for the new prompt.
# Sentences and words have separate versions: changing one prompt keeps the other cache.
app.claude.sentence-prompt-version=v6
app.claude.word-prompt-version=v7

# Health check for Docker and the VPS. Only /actuator/health is public; it shows UP or DOWN and nothing else.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Behind Caddy the real client IP is in X-Forwarded-For. Tomcat trusts that header only from private/loopback proxies.
# The login rate limit needs the real IP.
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto

# Admin web app API (/api/admin). Needs ADMIN_JWT_SECRET (32+ characters) unless ADMIN_ENABLED=false.
app.admin.enabled=${ADMIN_ENABLED:true}
app.admin.jwt-secret=${ADMIN_JWT_SECRET:}
# The first admin is created at start-up only when no admin exists.
app.admin.email=${ADMIN_EMAIL:}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}
app.admin.cookie-secure=true
app.admin.allowed-origins=https://admin.loffy.me,http://localhost:5173

# We have our own login; Spring Security's generated default user ("Using generated security password") is not wanted.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
