spring.application.name=backend
# 8080 is taken by the local Jitsi container.
server.port=${PORT:8081}

# Load secrets from backend/.env (git-ignored), like dotenv in JS. A real env variable wins over the file.
spring.config.import=optional:file:.env[.properties]

# Schema comes from Flyway (src/main/resources/db/migration). Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

app.claude.api-key=${CLAUDE_API_KEY:}
app.claude.model=${CLAUDE_MODEL:claude-haiku-5-5}
# An Anthropic-compatible gateway instead of api.anthropic.com: its URL (without /v1) and its Bearer token.
# Empty = Anthropic itself with CLAUDE_API_KEY. A gateway may sell other model IDs: set CLAUDE_MODEL,
# CLAUDE_SCENE_MODEL and a price for each below.
app.claude.base-url=${CLAUDE_BASE_URL:}
app.claude.auth-token=${CLAUDE_AUTH_TOKEN:}
# The model that writes the AI picture scene (the admin's wand, TASK-91).
app.claude.scene-model=${CLAUDE_SCENE_MODEL:claude-sonnet-5-5}
# Effort for the sentence and word calls. Empty = not sent: models before the 5 family refuse it.
app.claude.effort=${CLAUDE_EFFORT:low}
# Bump a version when its prompt changes, so old cached answers are not served for the new prompt.
# Sentences and words have separate versions: changing one prompt keeps the other cache.
app.claude.sentence-prompt-version=v8
app.claude.word-prompt-version=v7
# One tiny Claude call after start-up so the first sentence is not slow (TASK-75).
app.claude.warm-up=${CLAUDE_WARM_UP:true}

# Health check for Docker and the VPS. Only /actuator/health is public; it shows UP or DOWN and nothing else.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Behind Caddy the real client IP is in X-Forwarded-For. Tomcat trusts that header only from private/loopback proxies.
# The login rate limit needs the real IP.
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto

# Admin web app API (/api/admin). Needs ADMIN_JWT_SECRET (32+ characters) unless ADMIN_ENABLED=false.
app.admin.enabled=${ADMIN_ENABLED:true}
app.admin.jwt-secret=${ADMIN_JWT_SECRET:}
# The first admin is created at start-up only when no admin exists.
app.admin.email=${ADMIN_EMAIL:}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}
app.admin.cookie-secure=true
app.admin.allowed-origins=https://admin.loffy.me,http://localhost:5173

# We have our own login; Spring Security's generated default user ("Using generated security password") is not wanted.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Sense photos and clips (TASK-49.4). The files live in MEDIA_DIR; on the VPS Caddy serves that folder at MEDIA_BASE_URL.
app.media.dir=${MEDIA_DIR:./media}
app.media.base-url=${MEDIA_BASE_URL:https://api.loffy.me/media}
# Empty = new backend words get no picture (no calls to Pixabay).
app.media.pixabay-api-key=${PIXABAY_API_KEY:}

# AI pictures drawn from the admin (TASK-91): the Codex CLI on the server, signed in with the developer's ChatGPT login.
# false (default) = nothing is drawn (503 ai_unavailable); the production compose file turns it on (doc-11).
app.media.ai.enabled=${AI_PICTURES_ENABLED:false}
# The most pictures started per UTC day. It protects the ChatGPT plan, not money.
app.media.ai.pictures-per-day=${AI_PICTURES_PER_DAY:30}
# The most the wand (Claude Sonnet writes a new scene) may spend per UTC day, in US dollars. It also counts toward
# CLAUDE_DAILY_BUDGET_USD.
app.media.ai.scene-daily-usd=${AI_SCENE_DAILY_USD:1.00}
app.media.ai.codex-command=codex
# The folder with auth.json (the ChatGPT login). Codex saves the pictures in generated_images there.
app.media.ai.codex-home=${CODEX_HOME:${user.home}/.codex}
# read-only is enough to draw. If it fails inside Docker, try workspace-write (never a "danger" flag), see doc-11.
app.media.ai.sandbox=${AI_CODEX_SANDBOX:read-only}
app.media.ai.timeout=${AI_CODEX_TIMEOUT:10m}

# Accounts (TASK-66). Sign-in is an email code; the app then sends "Authorization: Bearer <access token>".
# Signs the access tokens (32+ characters). Empty = a key is derived from ADMIN_JWT_SECRET (a warning is logged).
app.auth.user-jwt-secret=${USER_JWT_SECRET:}
app.auth.access-token-lifetime=1h
app.auth.refresh-token-lifetime=60d
app.auth.code-lifetime=10m
app.auth.max-code-tries=5
# true = a guest (no token) cannot cause a new Claude call: 401 sign_in_required.
# Set REQUIRE_SIGN_IN=false until the app version with sign-in is released. Guests are then still checked by the
# daily budget and by the per-IP limit below (app.limits.claude-per-guest-ip).
app.auth.require-sign-in=${REQUIRE_SIGN_IN:true}

# Sign in with Google and Apple (TASK-92, doc-17). The app sends the provider's ID token; it must be made for one of
# these client IDs ("aud"), comma-separated. Empty = that button answers 503 provider_not_configured.
# Google: the iOS OAuth client ID from Google Cloud (and later a web client ID). Apple: the app bundle IDs.
app.auth.social.google-client-ids=${GOOGLE_CLIENT_IDS:}
app.auth.social.apple-client-ids=${APPLE_CLIENT_IDS:com.luke.EnglishTranslation,com.luke.EnglishTranslation.Mac}
app.auth.social.google-jwks-url=${GOOGLE_JWKS_URL:https://www.googleapis.com/oauth2/v3/certs}
app.auth.social.apple-jwks-url=${APPLE_JWKS_URL:https://appleid.apple.com/auth/keys}

# The emailed sign-in link (TASK-92). The email links to {PUBLIC_BASE_URL}/auth/link?token=..., a page that opens
# {APP_URL_SCHEME}://sign-in?token=... in the app. When the domain moves, change PUBLIC_BASE_URL (doc-17 checklist).
app.auth.link.lifetime=15m
app.auth.link.public-base-url=${PUBLIC_BASE_URL:https://api.loffy.me}
app.auth.link.app-url-scheme=${APP_URL_SCHEME:saynata}
# Paid Apple account only: "TEAMID.com.luke.EnglishTranslation". Set = /.well-known/apple-app-site-association is
# served, so iOS opens the link in the app directly (universal link). Empty = 404.
app.auth.link.apple-app-ids=${APPLE_APP_IDS:}

# Email (TASK-66, TASK-71). Sender: Resend if RESEND_API_KEY is set, else SES if EMAIL_FROM (or the old SES_FROM_EMAIL)
# is set, else codes are not emailed, they are written to the log (dev, tests).
# SES reads its keys from the standard AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY variables.
app.email.from=${EMAIL_FROM:}
app.email.ses-from=${SES_FROM_EMAIL:}
app.email.region=${AWS_REGION:}
app.email.resend-api-key=${RESEND_API_KEY:}

# Rate limits (TASK-69). "max requests per period"; a token bucket in memory, one server. Each can be set from env.
app.limits.email-code-per-ip.max=${LIMIT_EMAIL_CODE_IP_MAX:5}
app.limits.email-code-per-ip.period=${LIMIT_EMAIL_CODE_IP_PERIOD:1h}
app.limits.email-code-per-email.max=${LIMIT_EMAIL_CODE_EMAIL_MAX:3}
app.limits.email-code-per-email.period=${LIMIT_EMAIL_CODE_EMAIL_PERIOD:15m}
# New Claude calls per signed-in user (cache hits are not counted).
app.limits.claude-per-user-hour.max=${LIMIT_CLAUDE_USER_HOUR_MAX:60}
app.limits.claude-per-user-hour.period=1h
app.limits.claude-per-user-day.max=${LIMIT_CLAUDE_USER_DAY_MAX:300}
app.limits.claude-per-user-day.period=24h
# New Claude calls by guests, per client IP. Used only when REQUIRE_SIGN_IN=false.
app.limits.claude-per-guest-ip.max=${LIMIT_CLAUDE_GUEST_IP_MAX:30}
app.limits.claude-per-guest-ip.period=1h
# /api/translations* and /api/words/* per client IP, cache hits included.
app.limits.public-read-per-ip.max=${LIMIT_PUBLIC_READ_IP_MAX:120}
app.limits.public-read-per-ip.period=${LIMIT_PUBLIC_READ_IP_PERIOD:1m}

# Daily Claude budget (TASK-67). When today's spend (UTC day) reaches this many US dollars, no new Claude call
# is made until midnight UTC; cached answers still work (503 daily_limit_reached).
app.claude.daily-budget-usd=${CLAUDE_DAILY_BUDGET_USD:1.00}
# Price in US dollars per million tokens, for prompts up to 100K tokens. Our prompts are far smaller.
# CHECK THESE against https://platform.claude.com/docs/en/about-claude/pricing when you change the model or when
# Anthropic changes prices. Claude Haiku 5.5: $0.10 input, $0.50 output (checked 2026-10-15; above 100K prompt
# tokens it is $0.50 / $2.50). A model with no price here is counted at the highest price listed.
app.claude.pricing.claude-haiku-5-5.input-per-mtok=0.10
app.claude.pricing.claude-haiku-5-5.output-per-mtok=0.50
# Claude Sonnet 5.5 writes the scene of an AI picture (TASK-91, the wand in the admin): $2.00 input, $10.00 output, the
# prices media_ai.py uses (checked 2026-10-16). CHECK them against the pricing page like the Haiku ones.
app.claude.pricing.claude-sonnet-5-5.input-per-mtok=2.00
app.claude.pricing.claude-sonnet-5-5.output-per-mtok=10.00
# Claude Haiku 4.5, for a gateway that sells it: $1.00 input, $5.00 output (Anthropic's list price; a gateway may
# charge less, so the daily budget then stops early rather than late).
app.claude.pricing.claude-haiku-4-5.input-per-mtok=1.00
app.claude.pricing.claude-haiku-4-5.output-per-mtok=5.00
# DeepSeek V4.1 Flash on the STEYG gateway, the sentence and word model there: $0.30 input, $1.20 output (STEYG's
# price list on https://steyg.one, checked 2026-10-20). The id has a dot, so it needs [brackets] or Spring splits it.
app.claude.pricing.[deepseek-v4.1-flash].input-per-mtok=0.30
app.claude.pricing.[deepseek-v4.1-flash].output-per-mtok=1.20
# The prompt texts for the AI picture scene (AiPrompts.java, copied from pipeline media_ai.py). Bump it together with
# PROMPT_VERSION in the pipeline when the texts change.
app.claude.scene-prompt-version=ai-v1

# Prefill job (TASK-83.1): answers queued words and phrases before users ask, so they are in the shared cache.
# It has its own money cap per run; its Claude calls are saved as feature PREFILL and do not count toward the daily budget.
# A Spring cron (six fields: second minute hour day month weekday) in UTC. Empty = it never runs by itself.
app.prefill.cron=${PREFILL_CRON:}
# The queue sources the scheduled run answers (comma list). The night job is for what users typed (sentence-words);
# words, phrases and sentences the developer queues are run at once with POST /api/admin/prefill/run?source=... (TASK-83.12).
app.prefill.cron-sources=${PREFILL_CRON_SOURCES:sentence-words}
app.prefill.max-usd-per-run=${PREFILL_MAX_USD_PER_RUN:0.50}
# Pause after each NEW word, so the Pixabay picture jobs (100 requests a minute) and the thread pool are not flooded.
app.prefill.delay=${PREFILL_DELAY:0s}
# A failed item is tried again by later runs until it has failed this many times.
app.prefill.max-attempts=3

# Admin file upload for a sense (TASK-79). One file per request, so the request limit is a little above the file limit.
# The server converts the file to a small WebP or MP4 anyway. Caddy has no request-body limit by default (doc-11).
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:26MB}
