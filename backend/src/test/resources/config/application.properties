# Loaded next to src/main/resources/application.properties, only in tests.
# Never read backend/.env in tests: the developer's real keys and model would change the results.
# The file does not exist, and the import is optional.
app.env-file=no-env-file-in-tests
app.admin.jwt-secret=test-secret-test-secret-test-secret-123456
# Most old tests call the services as a guest and expect a Claude call to work. Tests of the sign-in rule set this to true.
app.auth.require-sign-in=false
# Old tests make many guest calls from one test IP; the guest limit has its own test.
app.limits.claude-per-guest-ip.max=100000

# The tests must never call Claude at start-up (TASK-75).
app.claude.warm-up=false
